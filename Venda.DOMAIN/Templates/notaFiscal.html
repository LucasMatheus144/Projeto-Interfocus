<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Nota Fiscal</title>
    <link rel="stylesheet" href="nota-fiscal.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 30px;
            margin: 0;
        }

        .nota-container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .titulo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .info p {
            font-size: 16px;
            margin: 8px 0;
        }

        .descricao {
            margin-top: 30px;
        }

            .descricao h2 {
                font-size: 20px;
                margin-bottom: 10px;
            }

            .descricao p {
                font-size: 16px;
                white-space: pre-wrap;
                line-height: 1.5;
            }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="nota-container">
        <h1 class="titulo">Nota Fiscal</h1>
        <hr />
        <div class="info">
            <p><strong>Razão Social:</strong> {{RAZAOSOCIAL}}</p>
            <p><strong>Nome:</strong> {{NOME}}</p>
            <p><strong>Valor:</strong> {{VALOR}}</p>
            <p><strong>Data de Pagamento:</strong> {{DATA}}</p>
        </div>
        <div class="descricao">
            <h2>Descrição:</h2>
            <p>{{DESCRICAO}}</p>
        </div>
        <footer>
            <p>Documento gerado automaticamente - {{DATAATUAL}}</p>
        </footer>
    </div>
</body>

</html>
